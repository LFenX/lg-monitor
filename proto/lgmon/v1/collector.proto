syntax = "proto3";

package lgmon.v1;

option go_package = "github.com/LFenX/lg-monitor/proto/lgmon/v1;lgmonv1";

service CollectorLink {
  rpc Connect(stream CollectorMessage) returns (stream MonitorMessage);
}

message CollectorMessage {
  oneof body {
    Hello hello = 1;
    Batch batch = 2;
    Heartbeat heartbeat = 3;
    ConfigApplied config_applied = 4;
  }
}

message MonitorMessage {
  oneof body {
    Welcome welcome = 1;
    Ack ack = 2;
    ConfigPush config = 3;
  }
}

message Hello {
  string collector_id = 1;
  string hostname = 2;
  string version = 3;
  uint64 last_acked_seq = 4;
}

message Welcome {
  bool accepted = 1;
  uint64 resume_from = 2;
}

message Batch {
  repeated Record records = 1;
}

message Ack {
  uint64 seq = 1;
}

message Heartbeat {
  int64 ts = 1;
}

message ConfigApplied {
  string version = 1;
  bool ok = 2;
  string error = 3;
}

message ConfigPush {
  string version = 1;
  // Contains only target and probe configuration, never notification credentials.
  bytes targets_json = 2;
}

message Record {
  uint64 seq = 1;
  int64 ts = 2;
  oneof body {
    TargetStatus target_status = 3;
    ProbeResult probe_result = 4;
    ProcessSample process_sample = 5;
  }
}

message TargetStatus {
  string target_id = 1;
  string state = 2;
  string process = 3;
  string port = 4;
  string reason = 5;
  bool full = 6;
  repeated ProcessRef processes = 7;
  repeated Port ports = 8;
}

message ProcessRef {
  int32 pid = 1;
  int32 parent_pid = 2;
  string name = 3;
  string exe = 4;
  int64 created_at = 5;
  double cpu_percent = 6;
  uint64 rss = 7;
  int32 threads = 8;
}

message Port {
  string local_address = 1;
  uint32 port = 2;
  int32 pid = 3;
}

message ProbeResult {
  string target_id = 1;
  int32 probe = 2;
  int64 ts = 3;
  bool ok = 4;
  int64 latency_ms = 5;
  int32 status_code = 6;
  string error = 7;
}

message ProcessSample {
  string target_id = 1;
  int32 pid = 2;
  int64 created_at = 3;
  double cpu_percent = 4;
  uint64 rss = 5;
}
