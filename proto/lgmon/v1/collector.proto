syntax = "proto3";

package lgmon.v1;

option go_package = "github.com/LFenX/lg-monitor/proto/lgmon/v1;lgmonv1";

service CollectorLink {
  rpc Connect(stream CollectorMessage) returns (stream MonitorMessage);
}

message CollectorMessage {
  oneof body {
    Hello hello = 1;
    Batch batch = 2;
    Heartbeat heartbeat = 3;
    ConfigApplied config_applied = 4;
    ProcessList process_list = 5;
    ServiceSwitchSummary service_switch_summary = 6;
  }
}

message MonitorMessage {
  oneof body {
    Welcome welcome = 1;
    Ack ack = 2;
    ConfigPush config = 3;
    ProcessQuery process_query = 4;
    ServiceSwitchQuery service_switch_query = 5;
  }
}

message Hello {
  string collector_id = 1;
  string hostname = 2;
  string version = 3;
  uint64 last_acked_seq = 4;
  repeated string capabilities = 5;
  int64 current_time = 6;
}

message Welcome {
  bool accepted = 1;
  uint64 resume_from = 2;
}

message Batch {
  repeated Record records = 1;
}

message Ack {
  uint64 seq = 1;
}

message Heartbeat {
  int64 ts = 1;
  int64 cache_bytes = 2;
  int64 cache_max_bytes = 3;
  optional double cache_bytes_per_hour = 4;
}

message ConfigApplied {
  string version = 1;
  bool ok = 2;
  string error = 3;
}

message ConfigPush {
  string version = 1;
  // Contains only target and probe configuration, never notification credentials.
  bytes targets_json = 2;
}

message ProcessQuery {
  string request_id = 1;
  bytes match_json = 2;
}

message ServiceSwitchQuery {
  string request_id = 1;
}

message ServiceSwitchSummary {
  string request_id = 1;
  bytes summary_json = 2;
  string sha256 = 3;
  int64 read_at = 4;
  string error_code = 5;
  string error = 6;
}

message ProcessList {
  string request_id = 1;
  int64 collected_at = 2;
  repeated ProcessInfo processes = 3;
  bool truncated = 4;
  string reason = 5;
  string error = 6;
}

message ProcessInfo {
  ProcessRef process = 1;
  repeated Port ports = 2;
  repeated string services = 3;
  string work_dir = 4;
}

message Record {
  uint64 seq = 1;
  int64 ts = 2;
  oneof body {
    TargetStatus target_status = 3;
    ProbeResult probe_result = 4;
    ProcessSample process_sample = 5;
    DataGap data_gap = 6;
    SystemMetrics system_metrics = 7;
    ServiceStatus service_status = 8;
    EventLogEvent event_log = 9;
    EventLogNotice event_log_notice = 10;
  }
}

message EventLogEvent {
  string channel = 1;
  string provider = 2;
  uint32 event_id = 3;
  uint32 level = 4;
  uint64 record_id = 5;
  string subject = 6;
  string message = 7;
  repeated string presets = 8;
  repeated EventLogTarget targets = 9;
}

message EventLogTarget {
  string id = 1;
  string via = 2;
}

message EventLogNotice {
  string kind = 1;
  string channel = 2;
  string message = 3;
  uint64 count = 4;
}

message DataGap {
  uint64 from_seq = 1;
  uint64 to_seq = 2;
  uint64 dropped = 3;
  string reason = 4;
}

message TargetStatus {
  string target_id = 1;
  string state = 2;
  string process = 3;
  string port = 4;
  string reason = 5;
  bool full = 6;
  repeated ProcessRef processes = 7;
  repeated Port ports = 8;
  string service = 9;
  string service_name = 10;
}

message ProcessRef {
  int32 pid = 1;
  int32 parent_pid = 2;
  string name = 3;
  string exe = 4;
  int64 created_at = 5;
  double cpu_percent = 6;
  uint64 rss = 7;
  int32 threads = 8;
}

message Port {
  string local_address = 1;
  uint32 port = 2;
  int32 pid = 3;
}

message ProbeResult {
  string target_id = 1;
  int32 probe = 2;
  int64 ts = 3;
  bool ok = 4;
  int64 latency_ms = 5;
  int32 status_code = 6;
  string error = 7;
  string type = 8;
  string message = 9;
  map<string, double> metrics = 10;
  int64 tls_not_after = 11;
  string tls_subject = 12;
}

message ProcessSample {
  string target_id = 1;
  int32 pid = 2;
  int64 created_at = 3;
  double cpu_percent = 4;
  uint64 rss = 5;
}

message SystemMetrics {
  int64 ts = 1;
  double cpu_percent = 2;
  uint64 memory_total = 3;
  uint64 memory_used = 4;
  uint64 memory_available = 5;
  double memory_percent = 6;
  uint64 uptime_seconds = 7;
  repeated DiskMetrics disks = 8;
  repeated NetworkMetrics networks = 9;
  repeated string errors = 10;
}

message DiskMetrics {
  string path = 1;
  uint64 total = 2;
  uint64 used = 3;
  uint64 free = 4;
  double used_percent = 5;
}

message NetworkMetrics {
  string name = 1;
  uint64 bytes_sent = 2;
  uint64 bytes_received = 3;
  double send_bytes_per_sec = 4;
  double receive_bytes_per_sec = 5;
}

message ServiceStatus {
  string name = 1;
  string display_name = 2;
  string state = 3;
  string start_type = 4;
  int32 pid = 5;
  string error = 6;
}
