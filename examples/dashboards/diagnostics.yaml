# yaml-language-server: $schema=../../schemas/dashboard.schema.json
id: diagnostics
title: 告警与诊断
refresh: 10s
panels:
  - id: alert-events
    type: log
    title: 告警事件
    query: SELECT e.ts, e.kind AS level, e.message FROM alert_events e JOIN alerts a ON a.id = e.alert_id WHERE e.ts BETWEEN :from AND :to AND (:collector IS NULL OR a.collector_id = :collector) ORDER BY e.ts DESC
    width: 8
  - id: current-alerts
    type: alerts
    title: 当前故障
    query: SELECT summary, severity, state, started_at FROM v_alerts_active WHERE (:collector IS NULL OR collector_id = :collector) ORDER BY started_at DESC
    width: 4
  - id: target-details
    type: table
    title: 当前目标详情
    query: SELECT collector_id, target_id, state, ts, detail FROM v_target_current WHERE (:collector IS NULL OR collector_id = :collector) ORDER BY collector_id, target_id
    width: 12
