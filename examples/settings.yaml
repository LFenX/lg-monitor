# yaml-language-server: $schema=../schemas/settings.schema.json
httpListen: 127.0.0.1:7444
# Set this to the monitor's reachable URL when sharing alert cards.
publicBaseUrl: http://127.0.0.1:7444
# Only opens after a team is created; reachable addresses require explicit setup.
# teamListen: 127.0.0.1:7445
# teamPublicUrl: https://127.0.0.1:7445
# Collector-local cache limit; changing it requires a collector restart.
cache:
  maxSize: 500MB
# Collector-local read-only startup/task inventory; restart after changing it.
inventory:
  interval: 1m
# Collector-local grants; HTTP/MCP cannot change them. No service is granted by default.
remoteOperations:
  enabled: false
# Optional collector-local source; restart collector after setting it locally.
# serviceSwitch:
#   path: 'D:\fake-tools\service-switch\config\services.json'
retention:
  raw: 24h
  minute: 14d
  hour: 365d
