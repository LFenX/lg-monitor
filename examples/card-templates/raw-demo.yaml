id: raw-demo
name: 自定义 JSON 卡片示例
raw:
  firing:
    schema: "2.0"
    body:
      elements:
        - tag: markdown
          content: "{{.Alert.Summary}}"
  resolved:
    schema: "2.0"
    body:
      elements:
        - tag: markdown
          content: "已恢复：{{.Alert.Summary}}"
