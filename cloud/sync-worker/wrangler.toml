name = "lgmon-sync"
main = "src/index.ts"
compatibility_date = "2026-01-01"

# Served only on its own domain (the lfen.ink zone is on the same Cloudflare account). Top-level keys must come
# before the first [table]; below one, TOML puts them inside that table and wrangler ignores them.
workers_dev = false
routes = [{ pattern = "sync.lfen.ink", custom_domain = true, zone_name = "lfen.ink" }]

[vars]
# Verified sender address in Resend (must match your domain verified in Resend).
MAIL_FROM = "lgmon <noreply@lfen.ink>"
APP_NAME = "lgmon"

# The repository is public, so the real database_id lives in wrangler.local.toml (git-ignored), a copy of
# this file that deploys use: npm run deploy. Find the id with: npx wrangler d1 list
[[d1_databases]]
binding = "DB"
database_name = "lgmon-sync"
database_id = "REPLACE_WITH_YOUR_D1_DATABASE_ID"

# Configure secrets via Wrangler (NEVER commit real keys here):
#   npx wrangler secret put RESEND_API_KEY -c wrangler.local.toml
