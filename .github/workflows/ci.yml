name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    env:
      CGO_ENABLED: '0'
    defaults:
      run:
        shell: powershell
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          package-manager-cache: false
      - uses: pnpm/action-setup@v6
        with:
          version: 11.21.0
          package_json_file: web/package.json
          standalone: false
      - name: Install frontend dependencies
        working-directory: web
        run: pnpm install --frozen-lockfile
      - name: Frontend tests
        working-directory: web
        run: pnpm test
      - name: Frontend build
        working-directory: web
        run: pnpm build
      - name: Check formatting
        run: |
          $unformatted = @(gofmt -l .)
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if ($unformatted.Count -gt 0) {
            $unformatted | Write-Output
            throw 'Go source files require gofmt.'
          }
      - name: Vet
        run: go vet ./...
      - name: Test
        run: go test ./...
      - name: Embedded frontend tests
        run: go test -tags webui ./web ./internal/api ./internal/app
      - name: Integration tests
        run: go test -count=1 -tags 'integration webui' ./cmd/lgmon ./internal/config ./internal/collector ./internal/secrets ./internal/transport ./internal/app ./internal/winsvc ./internal/notify
      - name: Build
        run: .\scripts\build.ps1
      - name: Check version
        run: .\bin\lgmon.exe version
      - name: Check M0 acceptance script without sending
        run: |
          $fixture = Join-Path ([IO.Path]::GetTempPath()) ('lgmon-m0-ci-' + [Guid]::NewGuid().ToString('N'))
          $configDirectory = Join-Path $fixture 'config'
          $notifiersFile = Join-Path $configDirectory 'notifiers.yaml'
          New-Item -ItemType Directory -Path $configDirectory -Force | Out-Null
          try {
            Copy-Item -LiteralPath .\examples\notifiers.yaml -Destination $notifiersFile
            .\scripts\m0-acceptance.ps1 -SourceHome $fixture -Notifier feishu-alerts -CheckOnly
          }
          finally {
            Remove-Item -LiteralPath $notifiersFile
            Remove-Item -LiteralPath $configDirectory
            Remove-Item -LiteralPath $fixture
          }
