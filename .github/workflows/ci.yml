name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  backlog-performance:
    runs-on: windows-latest
    env:
      CGO_ENABLED: '0'
    defaults:
      run:
        shell: powershell
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      # Keep the same end-to-end limit on a Go-only runner, isolated from frontend tooling.
      - name: Backlog performance with default build tags
        run: go test -count=1 -p 1 ./internal/transport -run '^TestTwentyThousandBacklogUsesBatchTransactionsAndBoundedRTT$' -v
      - name: Backlog performance with integration build tags
        run: go test -count=1 -p 1 -tags 'integration webui' ./internal/transport -run '^TestTwentyThousandBacklogUsesBatchTransactionsAndBoundedRTT$' -v
  collector-resources:
    runs-on: windows-latest
    env:
      CGO_ENABLED: '0'
    defaults:
      run:
        shell: powershell
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      # Native collection observes all machine processes and ETW events, including browser fixtures.
      - name: Native multi-monitor resource budget
        run: go test -count=1 -p 1 -tags integration ./internal/app -run '^TestNativeMultiMonitorIsolationReplayRevocationAndResources$' -v
      - name: Profile an exceeded collector budget
        if: failure()
        run: |
          $profileRoot = Join-Path $env:RUNNER_TEMP 'lgmon-collector-profile'
          New-Item -ItemType Directory -Path $profileRoot -Force | Out-Null
          $env:LGMON_MULTI_PROFILE = Join-Path $profileRoot 'collector'
          go test -count=1 -p 1 -tags integration ./internal/app -run '^TestNativeMultiMonitorIsolationReplayRevocationAndResources$' -v
      - name: Upload collector failure profiles
        if: failure()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: collector-failure-profiles
          path: ${{ runner.temp }}/lgmon-collector-profile
  build:
    needs: [backlog-performance, collector-resources]
    runs-on: windows-latest
    env:
      CGO_ENABLED: '0'
    defaults:
      run:
        shell: powershell
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          package-manager-cache: false
      - uses: pnpm/action-setup@v6
        with:
          version: 11.21.0
          package_json_file: web/package.json
          standalone: false
      - name: Install frontend dependencies
        working-directory: web
        run: pnpm install --frozen-lockfile
      - name: Frontend tests
        working-directory: web
        run: pnpm test
      - name: Frontend build
        working-directory: web
        run: pnpm build
      - name: Check formatting
        run: |
          $unformatted = @(gofmt -l .)
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if ($unformatted.Count -gt 0) {
            $unformatted | Write-Output
            throw 'Go source files require gofmt.'
          }
      - name: Vet
        run: go vet ./...
      - name: Test
        # SQLite throughput checks also run here and need isolation from other packages.
        # This test runs in both configurations in backlog-performance; all other tests stay here.
        run: go test -p 1 -skip '^TestTwentyThousandBacklogUsesBatchTransactionsAndBoundedRTT$' ./...
      - name: Embedded frontend tests
        run: go test -tags webui ./web ./internal/api ./internal/app
      - name: Integration tests
        # Native process/browser tests must not compete with throughput measurements.
        # Job logs need repository admin rights; a failure is also published as an annotation anyone can read.
        run: |
          [Console]::OutputEncoding = [Text.Encoding]::UTF8
          $lines = [System.Collections.Generic.List[string]]::new()
          go test -count=1 -p 1 -skip '^(TestTwentyThousandBacklogUsesBatchTransactionsAndBoundedRTT|TestNativeMultiMonitorIsolationReplayRevocationAndResources)$' -tags 'integration webui' ./cmd/lgmon ./internal/config ./internal/collector ./internal/collector/match ./internal/secrets ./internal/transport ./internal/app ./internal/winsvc ./internal/notify | ForEach-Object { $_; $lines.Add([string]$_) }
          $code = $LASTEXITCODE
          if ($code -ne 0) {
            # GitHub cuts each annotation at about 4 KB: failing tests and assertions first, then the log tail in pieces.
            $escape = { param($text) $text.Replace('%', '%25').Replace("`r", '%0D').Replace("`n", '%0A') }
            $failures = @($lines | Where-Object { $_ -match '^\s*(--- FAIL|FAIL\b|panic:)|_test\.go:\d+:' } | ForEach-Object { if ($_.Length -gt 400) { $_.Substring(0, 400) + '...' } else { $_ } }) -join "`n"
            if ($failures.Length -gt 3500) { $failures = $failures.Substring(0, 3500) }
            Write-Output ('::error title=Integration test failures::' + (& $escape $failures))
            $tail = ($lines | Select-Object -Last 300) -join "`n"
            if ($tail.Length -gt 21000) { $tail = $tail.Substring($tail.Length - 21000) }
            for ($i = 0; $i -lt $tail.Length; $i += 3500) {
              $part = $tail.Substring($i, [Math]::Min(3500, $tail.Length - $i))
              Write-Output ('::error title=Integration test log ' + ([int][Math]::Floor($i / 3500) + 1) + '::' + (& $escape $part))
            }
          }
          exit $code
      - name: Build
        run: .\scripts\build.ps1
      - name: Check version
        run: .\bin\lgmon.exe version
      - name: Check M0 acceptance script without sending
        run: |
          $fixture = Join-Path ([IO.Path]::GetTempPath()) ('lgmon-m0-ci-' + [Guid]::NewGuid().ToString('N'))
          $configDirectory = Join-Path $fixture 'config'
          $notifiersFile = Join-Path $configDirectory 'notifiers.yaml'
          New-Item -ItemType Directory -Path $configDirectory -Force | Out-Null
          try {
            Copy-Item -LiteralPath .\examples\notifiers.yaml -Destination $notifiersFile
            .\scripts\m0-acceptance.ps1 -SourceHome $fixture -Notifier feishu-alerts -CheckOnly
          }
          finally {
            Remove-Item -LiteralPath $notifiersFile
            Remove-Item -LiteralPath $configDirectory
            Remove-Item -LiteralPath $fixture
          }
      - name: Check M1 acceptance preflight without side effects
        run: |
          $fixture = Join-Path ([IO.Path]::GetTempPath()) ('lgmon-m1-ci-' + [Guid]::NewGuid().ToString('N'))
          $configDirectory = Join-Path $fixture 'config'
          New-Item -ItemType Directory -Path $configDirectory -Force | Out-Null
          try {
            .\scripts\m1-acceptance.ps1 -MonitorHome $fixture -CheckOnly
            if ($LASTEXITCODE -ne 0) { throw 'M1 preflight failed.' }
            if (Test-Path -LiteralPath (Join-Path $fixture 'data')) {
              throw 'Read-only preflight created a data directory.'
            }
          }
          finally {
            Remove-Item -LiteralPath $configDirectory
            Remove-Item -LiteralPath $fixture
          }
      - name: Build and verify isolated installer
        run: |
          $ErrorActionPreference = 'Stop'
          $tool = $null
          try {
            $tool = .\scripts\get-inno.ps1 | ConvertFrom-Json
            .\scripts\build-installer.ps1 -SkipBuild -CompilerPath $tool.compiler
            .\scripts\test-installer.ps1 -CompilerPath $tool.compiler
            $manifest = Get-Content -LiteralPath .\dist\lgmon-dev-windows-amd64-setup.json -Raw | ConvertFrom-Json
            if ($manifest.commit -ne $env:GITHUB_SHA -or $manifest.workingTreeDirty -or $manifest.fixture) {
              throw 'Installer provenance does not match the clean CI commit.'
            }
          }
          catch {
            # Job logs need admin rights to read, so the reason and the fixture logs go into annotations.
            $report = ($_ | Out-String) + "`n" + $_.ScriptStackTrace
            $logs = Get-ChildItem -LiteralPath ([IO.Path]::GetTempPath()) -Directory -Filter 'lgmon-installer-test-*' -ErrorAction SilentlyContinue | Sort-Object LastWriteTime | Select-Object -Last 1
            if ($logs) {
              foreach ($log in Get-ChildItem -LiteralPath $logs.FullName -Recurse -File -Filter '*.log' | Sort-Object LastWriteTime | Select-Object -Last 3) {
                $report += "`n--- " + $log.FullName.Substring($logs.FullName.Length) + "`n" + ((Get-Content -LiteralPath $log.FullName -Tail 25) -join "`n")
              }
            }
            $escaped = $report -replace '%', '%25' -replace "`r", '' -replace "`n", '%0A'
            for ($offset = 0; $offset -lt $escaped.Length; $offset += 3500) {
              Write-Output ('::error title=Installer step ' + ($offset / 3500 + 1) + '::' + $escaped.Substring($offset, [Math]::Min(3500, $escaped.Length - $offset)))
            }
            throw
          }
          finally {
            if ($null -ne $tool -and $tool.owned) {
              .\scripts\get-inno.ps1 -Directory $tool.directory -Remove
            }
          }
      - name: Upload installer artifacts
        uses: actions/upload-artifact@v7.0.2
        with:
          name: lgmon-windows-amd64-installer
          path: |
            dist/lgmon-setup-dev.exe
            dist/lgmon-dev-windows-amd64-setup.exe
            dist/lgmon-dev-windows-amd64-setup.json
          if-no-files-found: error
          retention-days: 7
